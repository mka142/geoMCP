[project]
name = "geomcp-server"
version = "0.1.0"
description = "Model-agnostic MCP server for fast, sourced geodata answers."
requires-python = "==3.12.*"
dependencies = [
    "geomcp-core",
    "fastmcp==4.0.11",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "prometheus-client==0.26.0",
    "python-dotenv==1.2.4",
    "structlog==26.1.0",
]

[project.scripts]
geomcp = "geomcp_server.cli:main"
geomcp-admin = "geomcp_server.admin:main"

[tool.uv.sources]
geomcp-core = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geomcp_server"]
