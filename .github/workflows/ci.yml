name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"  # nightly live smoke test

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # unit, MCP contract, transports and recorded-HTTP adapter tests; no credentials needed
      - run: uv run pytest -q

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t geomcp:ci .
      - name: smoke test (HTTP, API key, synthetic source)
        run: |
          docker run -d --name geomcp -p 8000:8000 -e GEOMCP_ENABLE_SYNTHETIC=true geomcp:ci
          KEY=$(docker exec geomcp geomcp-admin keys create --name ci)
          for i in $(seq 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp)" = "401"
          curl -fs -X POST localhost:8000/mcp \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"geomcp"'

  live:
    # Cheap real-service checks (a few processing units); costly tests run only on demand.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      GEOMCP_CDSE_CLIENT_ID: ${{ secrets.GEOMCP_CDSE_CLIENT_ID }}
      GEOMCP_CDSE_CLIENT_SECRET: ${{ secrets.GEOMCP_CDSE_CLIENT_SECRET }}
      GEOMCP_CDS_KEY: ${{ secrets.GEOMCP_CDS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run geomcp check
      - run: uv run pytest -q -m "live and not costly"
