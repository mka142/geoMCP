# geomcp behind an nginx container on the same Docker network (compose.proxy.yaml).
# TLS ends at nginx; plain HTTP to geomcp over the network, no host port.
# Put this inside your `server { listen 443 ssl; server_name geo.example.org; ... }` block.

location / {
    # Docker's DNS, looked up per request: nginx starts even while geomcp is down or being rebuilt
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $geomcp http://geomcp:8000;
    proxy_pass $geomcp;

    # MCP Streamable HTTP streams responses (Server-Sent Events): no buffering, HTTP/1.1, long timeouts.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # tool calls are small; downloads are served by geomcp itself
    client_max_body_size 1m;
}
