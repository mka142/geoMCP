[project]
name = "geomcp-workspace"
version = "0.1.0"
requires-python = "==3.12.*"

[tool.uv]
package = false
default-groups = ["dev", "crosscheck"]  # crosscheck is needed to type-check the live tests

[tool.uv.workspace]
members = ["packages/core", "packages/server"]

[tool.uv.sources]
geomcp-core = { workspace = true }
geomcp-server = { workspace = true }

[dependency-groups]
dev = [
    "geomcp-core",
    "geomcp-server",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-recording==0.14.0",
    "ruff==0.16.10",
    "pyright==1.1.414",
    "types-shapely==2.1.0.20260728",
    "pyarrow-stubs==20.0.0.20260819",
    "pre-commit==4.6.2",
]

# Independent reference computation for the costly live cross-check.
crosscheck = [
    "odc-stac==0.5.3",
    "pystac-client==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real external services with real credentials; skipped without them",
    "costly: spends hundreds of Sentinel Hub processing units; run on demand, never nightly",
]
addopts = "-m 'not live and not costly'"

[tool.ruff]
line-length = 120
target-version = "py312"
# Never touch Markdown: Markdown is prose, wrapped one sentence per line by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["geomcp_core", "geomcp_server", "tests"]

[tool.pyright]
include = ["packages", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["packages/core/src"]
