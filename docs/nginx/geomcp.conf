# geomcp behind nginx: TLS ends at nginx (certificates managed by you), plain HTTP to geomcp.
# Put this location block inside your existing `server { listen 443 ssl; server_name geo.example.org; ... }`.
# geomcp listens on 127.0.0.1:8000 (GEOMCP_BIND in .env); change proxy_pass if it runs elsewhere.

location / {
    proxy_pass http://127.0.0.1:8000;

    # MCP Streamable HTTP streams responses (Server-Sent Events): no buffering, HTTP/1.1, long timeouts.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # tool calls are small; downloads are served by geomcp itself
    client_max_body_size 1m;
}
